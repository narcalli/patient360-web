# CodeBuild, for the patient360-web pipeline (GitHub branch ovum → build and deploy). Checks and builds the static
# export, uploads it to the web bucket and clears CloudFront's cache, so a merge or push to ovum is live in minutes.
#
# The CodeBuild project needs: environment variables WEB_BUCKET (the S3 bucket CloudFront serves) and
# DISTRIBUTION_ID (the CloudFront distribution), and a role that may write to the bucket and invalidate the
# distribution. Security headers are not set here: they live in the CloudFront response headers policy, built from
# security-headers.mjs.
version: 0.2

phases:
  install:
    commands:
      # The Node version in .nvmrc (the build image's own Node is older).
      - command -v n >/dev/null || npm install -g n
      - n "$(cat .nvmrc)" >/dev/null && hash -r && node --version
  pre_build:
    commands:
      - npm ci --no-audit --no-fund
      - npm run check
  build:
    commands:
      - npm run build
  post_build:
    commands:
      # A failed build uploads nothing, so a broken commit never reaches the portal.
      - '[ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]'
      # Hashed assets first, cached for a year; then the pages, never cached, so a page never points at a missing asset.
      - aws s3 sync out/_next/static "s3://$WEB_BUCKET/_next/static" --cache-control "public,max-age=31536000,immutable"
      - aws s3 sync out "s3://$WEB_BUCKET" --delete --exclude "_next/static/*" --cache-control "no-cache"
      - aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" --query 'Invalidation.Id' --output text
